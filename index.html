<head>

<title>まなびバトル</title>
<style>
/* フォントは fonts/ に同梱（ネットなしで動く。ゲームで使う字＋かな＋JIS第1水準の漢字だけにしぼった版。OFL） */
@font-face{font-family:"DotLocal";src:url("fonts/DotGothic16-Regular.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:400 600;src:url("fonts/MPLUSRounded1c-Regular.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:700;src:url("fonts/MPLUSRounded1c-Bold.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:800 900;src:url("fonts/MPLUSRounded1c-ExtraBold.woff") format("woff")}
:root{--f:"DotLocal","BIZ UDPGothic","Meiryo",monospace;--gold:#ffd54a;--panel:rgba(15,23,42,.88);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* 日本語の改行：文節（ことばのまとまり）で折り返す・1〜2文字だけ次の行に落ちないように */
body{word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
button,.in,.mt,.mid,.big,.nm,.ttl,.qh,.lbl{text-wrap:balance}
.txt,.expl,.qt,.id,.msg,.blog,.qrow,.sm,.xs,.tip,.say{text-wrap:pretty}
button{font-family:var(--f);color:#fff;cursor:pointer;border:2px solid var(--line);background:#334155;border-radius:12px;padding:10px 16px;font-size:22px;transition:transform .08s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.2)}

input{font-family:var(--f);font-size:28px;padding:8px 12px;border-radius:10px;border:2px solid #94a3b8;width:360px}

.dprog .nz .nsub{background:#13a89e}.dprog .ne .nsub{background:#8b5cf6}.dprog .nf .nsub{background:#2f7bff}.dprog .nt .nsub{background:#f59e0b}.dprog .nb .nsub{background:#e11d48}
.dprog #dhome{font-size:18px;padding:6px 14px}
.field{position:absolute;top:70px;left:0;right:0;height:300px;display:flex;justify-content:space-around;align-items:center}

.hand{position:absolute;right:24px;top:390px;display:flex;gap:8px}
.slot{width:72px;height:72px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(0,0,0,.3);cursor:pointer;position:relative}
.slot .new{position:absolute;top:-8px;right:-8px;font-size:12px;background:#ef4444;border-radius:6px;padding:1px 4px}
.subjbar{position:absolute;bottom:24px;left:24px;right:24px;display:flex;gap:12px;justify-content:center}
.subjbar button{width:220px;height:96px;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}

.sbn{display:flex;align-items:center;gap:6px;line-height:1.15}

.subjbar .sbn{display:flex;align-items:center;gap:6px;line-height:1.15}
.msg{position:absolute;left:24px;top:390px;width:820px;font-size:24px;line-height:1.5;min-height:110px}
.float{position:absolute;font-size:36px;font-weight:bold;pointer-events:none;animation:fl 1.2s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.hit{animation:hit .4s}

.stt{font-size:22px;min-height:28px}
.gauge{position:relative;height:14px;background:#334155;border-radius:7px;overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fde047);transition:width .3s}
.gauge::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n,5) - 2px),rgba(15,23,42,.9) calc(100% / var(--n,5) - 2px) calc(100% / var(--n,5)));pointer-events:none}
.qgw{display:flex;align-items:center;gap:8px;color:#334155}.qg{width:300px;margin:0;border:2px solid #0f172a}.qgt{min-width:62px;color:#b45309}
.gauge.over{box-shadow:0 0 10px #fde047}.gauge.over i{background:linear-gradient(90deg,#fde047,#f472b6,#a78bfa)}
.blog{position:absolute;left:40px;right:40px;bottom:24px;min-height:150px;font-size:24px;line-height:1.5}
.turnlbl{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:30px}
.dmg{position:absolute;font-size:64px;color:#fde047;text-shadow:0 3px 0 #b45309,0 0 12px #000;animation:fl 1.1s ease-out forwards;pointer-events:none}
/* ルーレット（先攻・後攻）：金のふち・ライト・光の筋・中心のVS・勝った側が光る */
.rl{display:flex;flex-direction:column;align-items:center;gap:6px;animation:fi .3s}
.rl-title{font-size:34px;font-weight:bold;color:#fff;padding:6px 60px;border-radius:999px;background:linear-gradient(90deg,rgba(30,200,234,0),rgba(30,200,234,.9) 20%,rgba(30,120,234,.9) 80%,rgba(30,200,234,0));text-shadow:0 3px 0 #0b4f86}
.rl-stage{display:flex;align-items:center;gap:40px}
.rl-side{width:250px;text-align:center;padding:14px 8px 12px;border-radius:24px;background:rgba(10,18,48,.7);border:4px solid var(--sc);box-shadow:0 0 0 3px rgba(255,255,255,.5),0 10px 24px rgba(0,0,0,.5);transition:transform .3s,box-shadow .3s,filter .3s}
.rl-side.p{--sc:#3d8bff}.rl-side.b{--sc:#ff4d6a}
.rl-art{font-size:120px;line-height:1.05;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.rl-side.b .rl-art .art{display:inline-block;transform:scaleX(-1)}
.rl-nm{font-size:24px;font-weight:bold;color:#fff;margin-top:4px}
.rl-luck{display:inline-block;margin-top:6px;font-size:18px;color:#fff;background:var(--sc);border-radius:999px;padding:2px 14px}
.rl-side.win{transform:scale(1.12);box-shadow:0 0 0 4px #fff,0 0 40px 12px var(--sc),0 0 90px 20px #ffe27a;animation:rlwin .5s ease-in-out 2 alternate}
.rl-stage:has(.win) .rl-side:not(.win){filter:grayscale(.8) brightness(.6);transform:scale(.92)}
@keyframes rlwin{to{filter:brightness(1.35)}}
.rl-wheel{position:relative;width:380px;height:380px;display:flex;align-items:center;justify-content:center}
.rl-rays{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,180,.28) 0 8deg,rgba(255,240,180,0) 8deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 40%,transparent);mask:radial-gradient(closest-side,#000 40%,transparent);animation:sp 14s linear infinite}
.rl.spin .rl-rays{animation-duration:2.5s}
.rl-rim{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffe9a0,#d99a1e,#fff3c4,#c9851a,#ffe9a0,#d99a1e,#fff3c4,#c9851a,#ffe9a0);box-shadow:0 0 0 4px #7a4b0b,0 0 0 8px #ffe9a0,0 14px 30px rgba(0,0,0,.6)}
.rl-rim i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fffbe0;box-shadow:0 0 8px 3px #ffd54a;animation:blink .8s steps(2) infinite}
.rl-rim i:nth-child(odd){animation-delay:.4s}
.rl.spin .rl-rim i{animation-duration:.25s}
@keyframes blink{50%{background:#a8781a;box-shadow:none}}
.roul{width:320px;height:320px;border-radius:50%;border:5px solid #fff;position:relative;transition:transform 2.2s cubic-bezier(.15,.8,.25,1);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.rl-gloss{position:absolute;width:320px;height:320px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),rgba(255,255,255,0) 45%),radial-gradient(circle,rgba(0,0,0,0) 60%,rgba(0,0,0,.25))}
.rl-hub{position:absolute;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold;font-style:italic;color:#fff;
  background:radial-gradient(circle at 35% 30%,#ffe9a0,#d99a1e 60%,#8a5410);border:4px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.5);text-shadow:0 2px 0 #7a4b0b,0 0 8px #7a4b0b}
.needle{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:52px solid #ff3355;filter:drop-shadow(0 0 0 #fff) drop-shadow(0 4px 4px rgba(0,0,0,.5));z-index:2}
.needle::after{content:'';position:absolute;left:-12px;top:-48px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd54a);border:3px solid #7a4b0b}
.rl.spin .needle{animation:tick .12s ease-in-out infinite alternate}
@keyframes tick{to{transform:translateX(-50%) rotate(-12deg)}}
.rl-win{min-height:48px;font-size:32px;font-weight:bold;color:#ffe27a;text-shadow:0 3px 0 #7a4b0b,0 0 12px rgba(0,0,0,.8);animation:fi .3s}
.cutin{position:absolute;left:0;right:0;top:300px;height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.8),transparent);z-index:30;animation:ci 1.4s forwards;pointer-events:none}
.cutin.stay{animation:ci-in .3s forwards}@keyframes ci-in{0%{opacity:0;transform:scaleY(.2)}100%{opacity:1;transform:none}}
.nextmark{position:absolute;right:56px;bottom:30px;z-index:60;font-size:28px;color:#fde047;text-shadow:0 2px 4px rgba(0,0,0,.8);animation:nm .8s ease-in-out infinite;pointer-events:none}@keyframes nm{50%{transform:translateY(6px)}}
@keyframes ci{0%{opacity:0;transform:scaleY(.2)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* 問題リスト */
.qrow{font-size:20px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow:hover{background:rgba(255,255,255,.08)}
/* オーラ */
.aura-silver{animation:au-s 2s ease-in-out infinite}
.aura-gold{animation:au-g 2s ease-in-out infinite}
.aura-rainbow{animation:au-r 3s linear infinite}
@keyframes au-s{0%,100%{filter:drop-shadow(0 0 10px #e5e7eb) drop-shadow(0 0 22px #94a3b8)}50%{filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 40px #cbd5e1)}}
@keyframes au-g{0%,100%{filter:drop-shadow(0 0 10px #fde047) drop-shadow(0 0 22px #f59e0b)}50%{filter:drop-shadow(0 0 20px #fef08a) drop-shadow(0 0 44px #f59e0b)}}
@keyframes au-r{0%{filter:drop-shadow(0 0 14px #f87171) drop-shadow(0 0 30px #facc15)}33%{filter:drop-shadow(0 0 14px #4ade80) drop-shadow(0 0 30px #22d3ee)}66%{filter:drop-shadow(0 0 14px #818cf8) drop-shadow(0 0 30px #e879f9)}100%{filter:drop-shadow(0 0 14px #f87171) drop-shadow(0 0 30px #facc15)}}
/* アチーブメント */
.achtoast{position:absolute;right:20px;width:420px;background:linear-gradient(90deg,#78350f,#b45309);border:2px solid #fde68a;border-radius:12px;padding:8px 14px;font-size:20px;z-index:60;box-shadow:0 4px 14px #0009;animation:fi .4s;pointer-events:none}
/* 図鑑 */
.bkrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.bk{width:64px;height:64px;font-size:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer}
.bk.sel{outline:4px solid #fde047;background:rgba(253,224,71,.25)}
.bk.none .art{filter:brightness(0) opacity(.6)}
.art img{image-rendering:pixelated;image-rendering:crisp-edges}
/* ドット絵のモンスター：ふわふわ動く・影・主人公は相手のほうを向く */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.chara .emo .art img,.fighter .emo .art img,.field .me .art img,.field .foe .art img{animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 6px rgba(0,0,0,.45))}
/* 素材の絵は ぜんぶ右向きにそろえてある → 右側にいるもの（ボス・雑魚・対戦のプレイヤーB）は反転して 左向きに */
#fB .emo .art,.field .foe .art{display:inline-block;transform:scaleX(-1)}
.fighter.hit .art img{animation:none}
/* ガチャ */
.magic{width:260px;height:260px;border-radius:50%;border:6px dashed var(--c,#a78bfa);box-shadow:0 0 30px var(--c,#a78bfa),inset 0 0 40px var(--c,#a78bfa);opacity:.85}
.magic.spin{animation:sp 1.2s linear infinite}
.magic.flash{animation:sp .3s linear infinite;box-shadow:0 0 120px 60px var(--c,#fff)}
@keyframes sp{to{transform:rotate(360deg)}}
/* 先生用ページ */
.tt{border-collapse:collapse;width:100%}
.tt th,.tt td{border:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.tt th{background:rgba(255,255,255,.08)}
/* リザルト */
.res{background:linear-gradient(160deg,#422006,#1c1917)}
.tip{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#fef3c7;color:#422006;border-radius:12px;padding:10px 18px;font-size:22px;z-index:40;box-shadow:0 4px 12px #0008;max-width:900px;text-align:center}
