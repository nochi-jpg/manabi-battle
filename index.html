<style>
/* フォントは fonts/ に同梱（ネットなしで動く。ゲームで使う字＋かな＋JIS第1水準の漢字だけにしぼった版。OFL） */
@font-face{font-family:"DotLocal";src:url("fonts/DotGothic16-Regular.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:400 600;src:url("fonts/MPLUSRounded1c-Regular.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:700;src:url("fonts/MPLUSRounded1c-Bold.woff") format("woff")}
@font-face{font-family:"MBRound";font-weight:800 900;src:url("fonts/MPLUSRounded1c-ExtraBold.woff") format("woff")}
:root{--f:"DotLocal","BIZ UDPGothic","Meiryo",monospace;--gold:#ffd54a;--panel:rgba(15,23,42,.88);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:manipulation}
html.mob,html.mob body{position:fixed;inset:0;height:100dvh}
#rotHint{display:none}
.ver{position:absolute;left:18px;bottom:12px;font-size:16px;color:#fff;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
#rotHint .rphone{width:44px;height:76px;border:4px solid #fff;border-radius:8px;animation:rph 2s ease-in-out infinite}
@keyframes rph{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:600px){html.mob #rotHint{display:flex;position:fixed;inset:0;z-index:9999;background:#000;color:#fff;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:var(--f);font-size:22px;text-align:center}}
body{font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* 日本語の改行：文節（ことばのまとまり）で折り返す・1〜2文字だけ次の行に落ちないように */
body{word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
button,.in,.mt,.mid,.big,.nm,.ttl,.qh,.lbl{text-wrap:balance}
.txt,.expl,.qt,.id,.msg,.blog,.qrow,.sm,.xs,.tip,.say{text-wrap:pretty}
button{font-family:var(--f);color:#fff;cursor:pointer;border:2px solid var(--line);background:#334155;border-radius:12px;padding:10px 16px;font-size:22px;transition:transform .08s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.2)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--f);font-size:28px;padding:8px 12px;border-radius:10px;border:2px solid #94a3b8;width:360px}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:linear-gradient(160deg,#1e293b,#0f172a)}
#app{position:absolute;inset:0}
/* ---- リザルト：1つずつ ドンっ！ と出る ---- */
.rsl .rpanel{padding:18px 26px!important}
.rrow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rcell{text-align:center;opacity:.35;transform:scale(.9);transition:opacity .15s}
.rcell .rn{font-size:22px}.rcell .rv{font-size:30px;font-weight:900}
.rup{display:block;font-size:44px;font-weight:900;color:#16a34a;line-height:1.1;opacity:0}
.rup.zero{color:#94a3b8}
.rcell.on,.rtot.on,.rcoin.on{opacity:1;transform:none}
.rcell.on .rup,.rtot.on .rup{opacity:1;animation:don .5s cubic-bezier(.2,1.8,.4,1) both;text-shadow:0 0 12px #fff,0 0 24px rgba(74,222,128,.95),0 0 40px rgba(74,222,128,.7)}
.rcell.on .rup.zero{animation:none;text-shadow:none}
@keyframes don{0%{transform:scale(2.6);opacity:0;filter:brightness(2.5)}55%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.rtot{display:flex;align-items:baseline;justify-content:center;gap:16px;margin-top:10px;font-size:26px;opacity:.35}
.rtot b{font-size:40px}.rtot .rup{display:inline;font-size:54px;color:#f59e0b}
.rtot.on .rup{text-shadow:0 0 12px #fff,0 0 28px rgba(251,191,36,1),0 0 48px rgba(251,191,36,.8)}
.rcoin{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px;font-size:26px;opacity:.35}
.rcoin b{font-size:46px;color:#d97706}.rcoin.on b{text-shadow:0 0 14px rgba(251,191,36,.9)}
.rsl.shake{animation:shk .28s ease}
@keyframes shk{20%{transform:translate(-6px,4px)}45%{transform:translate(6px,-3px)}70%{transform:translate(-3px,2px)}100%{transform:none}}
.rstamp{position:absolute;right:28px;top:340px;width:210px;height:210px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f);font-weight:900;font-size:118px;line-height:.9;color:#fff;border:10px double rgba(255,255,255,.9);transform:rotate(-14deg) scale(3);opacity:0;z-index:5}
.rstamp small{font-size:30px;letter-spacing:.15em}
.rstamp.on{animation:stampin .35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stampin{0%{transform:rotate(-14deg) scale(3);opacity:0}70%{transform:rotate(-14deg) scale(.92);opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:1}}
.rkS{background:conic-gradient(#ff5f7e,#ffcf3f,#43d6a2,#1ec8ea,#8b5cf6,#ff5f7e);text-shadow:0 4px 0 rgba(0,0,0,.35);box-shadow:0 0 30px 10px rgba(255,255,255,.8),0 0 60px 20px rgba(255,120,220,.6)}
.rkS.on{animation:stampin .35s cubic-bezier(.3,1.6,.5,1) forwards,rkglow 1.6s linear .4s infinite}
@keyframes rkglow{50%{filter:hue-rotate(180deg) brightness(1.15)}}
.rkA{background:radial-gradient(circle,#ffe58a,#f5b301 70%,#b77900);color:#fff;text-shadow:0 4px 0 #8a5a00;box-shadow:0 0 30px 10px rgba(255,214,90,.85)}
.rkB{background:#e0344b;text-shadow:0 4px 0 #7a1020;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.rkC{background:#64748b;text-shadow:0 4px 0 #1e293b;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.selh .passb{margin-left:auto!important;align-self:center;font-size:16px!important;padding:4px 14px!important;min-height:0!important} /* こうさん：見出しの 右はし（パネルを 高くしない） */
.rkN{background:#475569;color:#cbd5e1;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.bpr button{width:150px;height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;border-width:4px}
/* 窓は 画面に おさめる（中身が 多いときは 中で スクロール。ボタンは いつも見える） */
.ov > .panel.evbox{max-height:680px!important;display:flex;flex-direction:column}
.ov > .panel.evbox > .txt{overflow-y:auto;min-height:0}
.ovhelp .evbox{width:980px}
.help2{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;text-align:left;font-size:20px;line-height:1.7;margin-bottom:8px}
.dbgp{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:14px 0}.dbgp label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px}.dbgp input{width:200px;font-size:22px;padding:4px 10px;text-align:right}
/* 上の ピル（スタミナ・まなびコイン）：アイコン｜名前｜数｜？ を 1行に きれいに */
.pill2{display:flex!important;align-items:center;gap:6px;height:44px;padding:0 10px 0 6px!important;line-height:1}
.pill2 .ic{display:flex;align-items:center;font-size:30px}.pill2 .ic .art img{height:32px!important;vertical-align:0!important}
.pill2 .pl{font-size:17px}.pill2 b{font-size:24px;min-width:1.6em;text-align:right}
.pill2 .pm{font-size:15px;opacity:.7}
.pill2 .ph{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#23305a;color:#fff;font-size:14px;margin-left:2px}
/* ホームの ステータス：アイコン｜教科名（はば固定）｜数（右ぞろえ）で たてが そろう */
.stats .stc{display:grid;grid-template-columns:30px 2.3em 3.3em;align-items:center;column-gap:4px}
.stats .sti2{display:flex;align-items:center;justify-content:center;height:30px}
.stats .sti2 .sji{vertical-align:0}.stats .sti2 .art img{height:26px!important;vertical-align:0}
.stats .stc b{text-align:right}
.meet{position:absolute;inset:0}
.meet-mon,.meet-k{position:absolute;left:50%;top:40px;transform:translateX(-50%);font-size:330px;line-height:1;opacity:0;transition:opacity .9s,left .7s}
.meet-mon .art img,.meet-k .art img{animation:bob 1.6s ease-in-out infinite;image-rendering:pixelated;filter:drop-shadow(0 12px 10px rgba(0,0,0,.5))}
.meet-mon.in,.meet-k.in{opacity:1}
.meet.two .meet-k{left:30%}.meet.two .meet-mon{left:70%}
.meet-shake .art img{animation:mshake .5s ease-in-out}
@keyframes mshake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-14px) rotate(-6deg)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px) rotate(-3deg)}80%{transform:translateX(5px) rotate(2deg)}}
/* まばたき：黒い まぶたが 上下に ひらく（出会いの はじめ） */
.lid{position:absolute;left:0;right:0;height:50%;background:#000;z-index:30;pointer-events:none}
.lid-t{top:0}.lid-b{bottom:0}.fast .lid{display:none}
.meet.open .lid-t{animation:lidT 1.9s ease-in-out forwards}.meet.open .lid-b{animation:lidB 1.9s ease-in-out forwards}
@keyframes lidT{0%{transform:translateY(0)}25%{transform:translateY(-35%)}40%{transform:translateY(0)}70%{transform:translateY(-60%)}80%{transform:translateY(-45%)}100%{transform:translateY(-101%)}}
@keyframes lidB{0%{transform:translateY(0)}25%{transform:translateY(35%)}40%{transform:translateY(0)}70%{transform:translateY(60%)}80%{transform:translateY(45%)}100%{transform:translateY(101%)}}
/* こくうさの 小さい顔（せつめい・ヒント） */
.koku-ic{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;flex:none;vertical-align:middle;font-size:46px;line-height:1}
.koku-ic .art img{height:52px!important;width:auto}
.tip.tip-k{display:flex;align-items:center;gap:8px;padding:4px 18px 4px 8px}
.tut-ht{display:flex;align-items:center;gap:8px}
.meet-name{position:absolute;left:50%;top:370px;transform:translateX(-50%);font-size:26px;color:#fff;text-shadow:0 2px 4px #000}
.meet-box{position:absolute;left:90px;right:90px;bottom:28px;min-height:170px;padding:20px 30px!important;cursor:pointer}
.meet-who{display:inline-block;background:#23305a;color:#fff;border-radius:999px;padding:2px 18px;font-size:18px;margin-bottom:6px}
.meet-t{font-size:28px;line-height:1.55}
.meet-next{position:absolute;right:26px;bottom:14px;font-size:24px;color:#f08a1c;animation:nm .8s ease-in-out infinite}
.tut{width:1060px}
.tut-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tut-b{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tut-row{display:flex;align-items:center;gap:22px;height:80px} /* 行の高さを そろえる（10/12） */
.tut-pic{flex:none;width:330px;height:72px;display:flex;justify-content:center;align-items:center;font-size:56px;pointer-events:none}
.tut-pic .ic .art img,.tut-pic .art img{height:64px!important}
.tut-btn{zoom:.62;pointer-events:none}.tut-btn > div{position:static!important;display:block!important;height:auto!important;background:none!important;padding:0!important;width:auto!important}
.tut-btn button,.tut-btn .menuR button.wide,.tut-btn .menuR button:not(.wide){width:440px!important;height:110px!important;min-height:0!important;max-width:none;display:flex!important;align-items:center;justify-content:center} /* ボタンの絵は ぜんぶ 同じ大きさ（10/12） */
.tut-t{font-size:21px;line-height:1.45;white-space:nowrap}
.tut-mons{display:flex;justify-content:center;align-items:center;gap:14px;font-size:120px;line-height:1}
.tut-mon .art img{image-rendering:pixelated}
.tut-mon.sil{filter:brightness(0)} /* 進化さきは 黒ぬりの シルエット */
.tut-ar{font-size:30px;color:#5d6b8f}
.cutnpc .art img{height:1.4em!important;image-rendering:pixelated;vertical-align:middle}
.pix img{image-rendering:pixelated}
.emoi{height:1em;width:auto;vertical-align:-.15em;display:inline-block}
.who .emoi,.who .art img{image-rendering:pixelated}
.sji{display:inline-block;vertical-align:-.12em}.sji .art img{height:1.05em!important;image-rendering:pixelated}
.logo{width:640px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b1430;color:#e2e8f0}.boot-t{font-size:30px}.boot-bar{width:520px;height:16px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa);transition:width .15s}
.scr{position:absolute;inset:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.big{font-size:40px}.mid{font-size:28px}.sm{font-size:18px}.xs{font-size:15px}
.gold{color:var(--gold)}.dim{color:#94a3b8}.red{color:#f87171}.green{color:#4ade80}
.btn-main{background:linear-gradient(180deg,#f59e0b,#d97706);border-color:#fde68a;font-size:30px;padding:14px 28px}
.btn-blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.btn-gray{background:#475569}
/* ホーム */
.home{background:linear-gradient(135deg,#3b2f63,#1f3b5a 60%,#16324a)}
.topbar{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px;background:rgba(0,0,0,.35);font-size:22px}
.topbar .sp{flex:1}
.chara{position:absolute;left:40px;top:62px;width:520px;bottom:108px;gap:3px}
.chara .emo{font-size:292px;line-height:.96;text-align:center;cursor:pointer;filter:drop-shadow(0 0 30px rgba(255,255,255,.25))}
.chara .say{white-space:nowrap;position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:5;max-width:500px;width:max-content;text-align:center;font-size:19px;color:#23305a;background:#fff;border:3px solid #23305a;border-radius:16px;padding:6px 14px;pointer-events:none}
.chara .say:empty{display:none}
.chara .say::after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-8px;border:8px solid transparent;border-top-color:#23305a;border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 14px;font-size:20px}
.menuR{position:absolute;right:30px;top:90px;width:610px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.menuR button{height:110px;font-size:24px;text-align:left;padding:12px 18px;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.mt{display:flex;flex-direction:column;gap:4px}.mi .art img{image-rendering:auto}
.menuR button:not(.wide){height:86px}

.volrow button{width:84px;font-size:26px;padding:8px 0}

.setbtns small{font-size:14px;color:#cbd5e1}
.cred .ch{margin:14px 0 6px}.cred .staff{text-align:center;margin:16px 0 4px}.cred .sr{font-size:18px;opacity:.75}.cred .sn{font-size:40px;font-weight:800;letter-spacing:.08em}.crow{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;padding:8px 10px;border-bottom:1px solid rgba(148,163,184,.3);font-size:18px;text-align:left}.crow .cn{font-weight:700}.crow .ca,.crow .cu{font-size:16px}.crow .ca small{display:block;font-size:14px;opacity:.75}.crow .cu{opacity:.8}

.bggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}

.sklist{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ダンジョン */
.dun{background:linear-gradient(180deg,#1c1917,#292524 50%,#0c0a09)}

.itemcard[class*=" rr"]{border-image:none !important;border:4px solid var(--rc) !important;border-radius:16px !important;

.itemcard.rr1{--rc:#3b82f6;--rt:#9cc8ff}.itemcard.rr2{--rc:#22c55e;--rt:#8ff0b0}.itemcard.rr3{--rc:#f97316;--rt:#ffc08a}.itemcard.rr4{--rc:#ec4899;--rt:#ffa6d6}.itemcard.rr5{--rc:#a855f7;--rt:#d9b3ff}

@keyframes gxSp{0%{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}15%{opacity:1}100%{transform:translate(0,0) scale(.3);opacity:0}}
