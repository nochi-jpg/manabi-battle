<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>まなびバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DotLocal";src:url("fonts/DotGothic16-Regular.ttf")}
:root{--f:"DotLocal","DotGothic16","BIZ UDPGothic","Meiryo",monospace;--gold:#ffd54a;--panel:rgba(15,23,42,.88);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:var(--f);color:#fff;cursor:pointer;border:2px solid var(--line);background:#334155;border-radius:12px;padding:10px 16px;font-size:22px;transition:transform .08s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.2)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--f);font-size:28px;padding:8px 12px;border-radius:10px;border:2px solid #94a3b8;width:360px}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:linear-gradient(160deg,#1e293b,#0f172a)}
#app{position:absolute;inset:0}
.scr{position:absolute;inset:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.big{font-size:40px}.mid{font-size:28px}.sm{font-size:18px}.xs{font-size:15px}
.gold{color:var(--gold)}.dim{color:#94a3b8}.red{color:#f87171}.green{color:#4ade80}
.btn-main{background:linear-gradient(180deg,#f59e0b,#d97706);border-color:#fde68a;font-size:30px;padding:14px 28px}
.btn-blue{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.btn-gray{background:#475569}
/* ホーム */
.home{background:linear-gradient(135deg,#3b2f63,#1f3b5a 60%,#16324a)}
.topbar{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px;background:rgba(0,0,0,.35);font-size:22px}
.topbar .sp{flex:1}
.chara{position:absolute;left:40px;top:84px;width:520px;bottom:120px}
.chara .emo{font-size:220px;line-height:1;text-align:center;cursor:pointer;filter:drop-shadow(0 0 30px rgba(255,255,255,.25))}
.chara .say{min-height:40px;text-align:center;font-size:20px;color:#fde68a}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 14px;font-size:20px}
.menuR{position:absolute;right:40px;top:90px;width:560px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.menuR button{height:110px;font-size:24px;text-align:left;padding:12px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.menuR .wide{grid-column:span 2;height:150px;font-size:34px;background:linear-gradient(135deg,#ea580c,#b91c1c);border-color:#fdba74}
.menuR small{font-size:16px;color:#e2e8f0}
.menuB{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;justify-content:center;gap:14px;align-items:center;background:rgba(0,0,0,.35)}
.menuB button{width:200px;height:70px;font-size:20px}
/* ダンジョン */
.dun{background:linear-gradient(180deg,#1c1917,#292524 50%,#0c0a09)}
.prog{position:absolute;top:12px;left:24px;right:24px;display:flex;align-items:center;gap:6px;font-size:26px}
.prog .n{opacity:.35}.prog .n.done{opacity:.7}.prog .n.cur{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 8px #fff)}
.prog .coin{margin-left:auto;font-size:24px}
.field{position:absolute;top:70px;left:0;right:0;height:300px;display:flex;justify-content:space-around;align-items:center}
.field .me,.field .foe{font-size:150px;line-height:1;text-align:center}
.field .lbl{font-size:20px;text-align:center}
.hand{position:absolute;right:24px;top:390px;display:flex;gap:8px}
.slot{width:72px;height:72px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;background:rgba(0,0,0,.3);cursor:pointer;position:relative}
.slot .new{position:absolute;top:-8px;right:-8px;font-size:12px;background:#ef4444;border-radius:6px;padding:1px 4px}
.subjbar{position:absolute;bottom:24px;left:24px;right:24px;display:flex;gap:12px;justify-content:center}
.subjbar button{width:220px;height:96px;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.subjbar small{font-size:18px}
.msg{position:absolute;left:24px;top:390px;width:820px;font-size:24px;line-height:1.5;min-height:110px}
.float{position:absolute;font-size:36px;font-weight:bold;pointer-events:none;animation:fl 1.2s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fl{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.hit{animation:hit .4s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.bye{animation:bye .7s forwards}
@keyframes bye{0%{opacity:1}30%{opacity:.2}50%{opacity:1}100%{opacity:0;transform:translateY(40px) scale(.8)}}
.fadein{animation:fi .5s}
@keyframes fi{from{opacity:0}to{opacity:1}}
/* オーバーレイ（問題・イベント） */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20}
.ov.ovb{align-items:flex-end;padding-bottom:16px;background:rgba(0,0,0,.25)}
.qbox{width:1080px;background:#f8fafc;color:#0f172a;border-radius:18px;padding:24px 28px;border:4px solid #334155}
.qbox .qh{font-size:20px;color:#475569;margin-bottom:6px}
.qbox .qt{font-size:34px;line-height:1.45;min-height:100px}
.qbox .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.qbox .opts button{background:#e2e8f0;color:#0f172a;border-color:#94a3b8;font-size:26px;padding:16px;min-height:80px}
.qbox .opts button.ok{background:#4ade80}.qbox .opts button.ng{background:#f87171}
.qbox .expl{margin-top:14px;font-size:24px;background:#fef9c3;border-radius:10px;padding:12px;line-height:1.5}
.lockbar{height:6px;background:#cbd5e1;border-radius:3px;margin-top:10px;overflow:hidden}
.lockbar i{display:block;height:100%;background:#3b82f6;width:0}
.evbox{width:960px}
.evbox .who{font-size:120px;text-align:center;line-height:1}
.evbox .txt{font-size:26px;line-height:1.6;margin:14px 0;white-space:pre-line}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.choices button{min-width:240px}
.itemcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:200px;padding:12px;border-radius:14px;background:#1e293b;border:2px solid var(--line)}
.itemcard .ie{font-size:56px}.itemcard .in{font-size:20px}.itemcard .id{font-size:15px;color:#cbd5e1;min-height:60px;text-align:center}
.r1{color:#cbd5e1}.r2{color:#86efac}.r3{color:#93c5fd}.r4{color:#d8b4fe}.r5{color:#fcd34d}
/* バトル */
.btl{background:linear-gradient(180deg,#312e81,#1e1b4b 60%,#0f0d2e)}
.fighter{position:absolute;top:70px;width:520px;text-align:center}
.fighter .emo{font-size:170px;line-height:1.1}
.fighter .nm{font-size:24px}
.hpbar{height:22px;background:#334155;border-radius:11px;overflow:hidden;border:2px solid #000;margin:6px 0}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .5s}
.hpbar.low i{background:linear-gradient(90deg,#dc2626,#f97316)}
.stt{font-size:22px;min-height:28px}
.gauge{height:14px;background:#334155;border-radius:7px;overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fde047);transition:width .3s}
.blog{position:absolute;left:40px;right:40px;bottom:24px;min-height:150px;font-size:24px;line-height:1.5}
.turnlbl{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:30px}
.dmg{position:absolute;font-size:64px;color:#fde047;text-shadow:0 3px 0 #b45309,0 0 12px #000;animation:fl 1.1s ease-out forwards;pointer-events:none}
.roul{width:300px;height:300px;border-radius:50%;border:6px solid #fff;position:relative;transition:transform 2.2s cubic-bezier(.15,.8,.25,1)}
.needle{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:40px}
.cutin{position:absolute;left:0;right:0;top:300px;height:120px;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.8),transparent);z-index:30;animation:ci 1.4s forwards;pointer-events:none}
@keyframes ci{0%{opacity:0;transform:scaleY(.2)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* リザルト */
.res{background:linear-gradient(160deg,#422006,#1c1917)}
.tip{position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#fef3c7;color:#422006;border-radius:12px;padding:10px 18px;font-size:22px;z-index:40;box-shadow:0 4px 12px #0008;max-width:900px;text-align:center}
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<script src="questions.js"></script>
<script src="data.js"></script>
<script src="assets.js"></script>
<script src="game.js"></script>
</body>
</html>
